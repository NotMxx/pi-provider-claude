# The typecheck and the tests on Linux x64 and arm64, the platforms whose Claude Code binary the extension pins.
# The tests use fakes for Claude Code and the npm registry; nothing here signs in or downloads the real binary.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The npm major this repository is developed with.
      - run: npm install -g npm@12.1.0
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  # The extension in a real pi, on the oldest pi it supports and the newest it was tested with: it loads, lists its
  # models and runs a turn with a tool call against the fake Claude Code.
  pi:
    strategy:
      fail-fast: false
      matrix:
        pi: ['0.99.1', '1.5.2']
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g npm@12.1.0
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pi" "@earendil-works/pi-coding-agent@${{ matrix.pi }}"
      - run: PI_CLI="$RUNNER_TEMP/pi/node_modules/@earendil-works/pi-coding-agent/dist/bundle/cli.js" node --test test/e2e/pi.test.ts
